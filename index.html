<!doctype html>
<html lang="it" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CodeFID+" />
    <meta
      name="description"
      content="CodeFID+ — Touch Code &amp; Git IDE per tablet, ottimizzato per sviluppo di codice, gestione repository Git e assistenza AI"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="./icons/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="./icons/apple-touch-icon-167x167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180x180.png" />
    <title>CodeFID+ - Touch Code &amp; Git IDE</title>
  </head>
  <body style="background-color:#0b0f19;color:#f1f5f9;" class="bg-[#0b0f19] text-slate-100 antialiased selection:bg-indigo-500/30 selection:text-indigo-200 overflow-hidden">
    <div id="root"></div>
    <script>
      // Auto-recovery if a stale cached HTML tries to load old deleted chunk hashes after a deploy
      window.addEventListener(
        'error',
        function (e) {
          var target = e.target;
          if (
            target &&
            (target.tagName === 'SCRIPT' || target.tagName === 'LINK') &&
            !sessionStorage.getItem('codefid_chunk_reload')
          ) {
            sessionStorage.setItem('codefid_chunk_reload', '1');
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                Promise.all(keys.map(function (k) { return caches.delete(k); })).finally(function () {
                  window.location.reload();
                });
              });
            } else {
              window.location.reload();
            }
          }
        },
        true
      );
      window.addEventListener('load', function () {
        sessionStorage.removeItem('codefid_chunk_reload');
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('./sw.js', { updateViaCache: 'none' })
            .then((registration) => {
              // Controlla aggiornamenti a ogni avvio dell'app e al ritorno in primo piano
              registration.update();
              document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                  registration.update().catch(() => {});
                }
              });

              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      // Nuova versione pronta: ricarica subito per mostrare l'interfaccia aggiornata
                      window.location.reload();
                    }
                  });
                }
              });
            })
            .catch(() => {});
        });
      }
    </script>
  </body>
</html>
